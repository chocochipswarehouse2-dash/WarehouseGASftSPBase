<!-- ========================================================
     MODUL VIEW: FULFILLMENT REFILL & PICKING LIST (SPA)
     FITUR: PERSISTENT PICKING LIST (2 TAB: ON-PROSES & SELESAI)
     1 BUBBLE 1 CSV, INTERACTIVE CHECKLIST PICKING & ALOKASI RAK
     ======================================================== -->
<section id="view-fulfillment" class="spa-view" style="display: none;">
  
  <!-- SUB-NAV / SEGMENTED TABS & TOP TOOLBAR -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
    <div class="wms-segmented-tabs">
      <button type="button" id="tabBtnFulfillmentProses" class="wms-segmented-tab-btn active" onclick="switchFulfillmentTab('proses')">
        🟡 PICKING ON PROSES <span id="badgeCountProses" class="tab-count-badge">0</span>
      </button>
      <button type="button" id="tabBtnFulfillmentSelesai" class="wms-segmented-tab-btn" onclick="switchFulfillmentTab('selesai')">
        🟢 SELESAI PICKING <span id="badgeCountSelesai" class="tab-count-badge">0</span>
      </button>
    </div>

    <div style="display: flex; gap: 6px; align-items: center;">
      <button class="btn btn-secondary" onclick="muatDataFulfillment(true)" style="height: 32px; padding: 0 10px; font-size: 11px;" title="Perbarui data Picking List dari database">
        🔄 REFRESH
      </button>
      <button id="btnTopCetakSemua" class="btn btn-primary" onclick="cetakSemuaSuratJalanAktif()" style="display: none; height: 32px; padding: 0 12px; font-size: 11px; font-weight: 700;" title="Cetak seluruh Surat Jalan aktif ke PDF">
        🖨️ CETAK SEMUA SJ
      </button>
    </div>
  </div>

  <!-- ========================================================
       TAB 1: PICKING ON PROSES
       ======================================================== -->
  <div id="fulfillmentTabProses">
    
    <!-- 1. COMPACT UPLOAD SECTION CARD -->
    <div class="data-section-card" style="margin-bottom: 14px;">
      <div class="data-section-header" style="padding: 10px 16px; background: var(--card-alt);">
        <div class="section-title-wrap">
          <span class="section-heading" style="font-size: 12.5px;">🚚 UPLOAD CSV TRANSFER ORDER (REFILL TOKO)</span>
        </div>
        <div class="section-badge-info" style="font-size: 11px;">
          1 CSV = 1 Kartu Picking List
        </div>
      </div>

      <div style="padding: 12px 16px;">
        <!-- Compact Upload Toolbar -->
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          
          <!-- File Input -->
          <div style="flex: 1; min-width: 240px;">
            <input type="file" id="csvFileInput" multiple accept=".csv" class="search-input compact-input" style="width: 100%; cursor: pointer;" onchange="handleCsvFileSelected(this)">
          </div>

          <!-- Checkbox Opsi Cetak Langsung -->
          <div style="display: flex; align-items: center; gap: 6px;">
            <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--text); cursor: pointer; user-select: none;">
              <input type="checkbox" id="chkDirectPrint" checked style="width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer;">
              <span>Langsung cetak PDF Surat Jalan</span>
            </label>
          </div>

          <!-- Tombol Proses Compact -->
          <div style="display: flex; gap: 6px;">
            <button id="btnProcessFulfillment" type="button" onclick="handleProcessFulfillment()" class="btn btn-primary" style="height: 32px; font-size: 11.5px; font-weight: 700; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px;" title="Proses CSV dan buat Picking List">
              <span id="processIcon">⚡</span>
              <span id="processLabel">PROSES CSV</span>
            </button>
            
            <button type="button" onclick="resetFulfillmentUpload()" class="btn btn-secondary" style="height: 32px; font-size: 11px; padding: 0 10px;" title="Kosongkan input file">
              RESET
            </button>
          </div>

        </div>

        <div id="fulfillmentToast" style="display: none; margin-top: 10px; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 11.5px; font-weight: 600;"></div>
      </div>
    </div>

    <!-- 2. DAFTAR BUBBLE PICKING ON PROSES -->
    <div class="data-section-card">
      <div class="data-section-header" style="padding: 10px 16px;">
        <div class="section-title-wrap">
          <span class="section-heading" style="font-size: 13px;">📋 DAFTAR PICKING LIST AKTIF (ON PROSES)</span>
        </div>
        <div id="fulfillmentProsesSummaryBadge" class="section-badge-info" style="font-size: 11px;">
          Memuat data...
        </div>
      </div>

      <!-- CONTAINER BUBBLE ON PROSES -->
      <div id="fulfillmentOnProcessContainer" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="text-align: center; padding: 35px 20px; color: var(--text-muted); font-style: italic;">
          ⏳ Mengambil data Picking List dari database WMS...
        </div>
      </div>
    </div>

  </div>

  <!-- ========================================================
       TAB 2: SELESAI PICKING
       ======================================================== -->
  <div id="fulfillmentTabSelesai" style="display: none;">
    
    <div class="data-section-card">
      <div class="data-section-header" style="padding: 10px 16px;">
        <div class="section-title-wrap">
          <span class="section-heading" style="font-size: 13px;">✅ RIWAYAT PICKING LIST SELESAI</span>
        </div>
        <div id="fulfillmentSelesaiSummaryBadge" class="section-badge-info" style="font-size: 11px;">
          0 Surat Jalan Selesai
        </div>
      </div>

      <!-- Filter Toolbar Selesai -->
      <div style="padding: 10px 16px; background: var(--card-alt); border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <input type="text" id="searchFulfillmentSelesai" class="search-input compact-input" placeholder="🔍 Cari No SJ / Toko Tujuan..." style="width: 240px;" oninput="renderFulfillmentCompletedBubbles()">
        <button class="btn btn-secondary" onclick="document.getElementById('searchFulfillmentSelesai').value=''; renderFulfillmentCompletedBubbles();" style="height: 32px; padding: 0 10px; font-size: 11px;">
          RESET
        </button>
      </div>

      <!-- CONTAINER BUBBLE SELESAI -->
      <div id="fulfillmentCompletedContainer" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="text-align: center; padding: 35px 20px; color: var(--text-muted); font-style: italic;">
          Belum ada Picking List yang diselesaikan.
        </div>
      </div>
    </div>

  </div>

</section>

<!-- JAVASCRIPT LOGIC FULFILLMENT REFILL -->
<script>

  let isFulfillmentInitialized = false;
  let FULFILLMENT_ON_PROCESS = []; // Data On-Process dari Database
  let FULFILLMENT_COMPLETED = [];  // Data Selesai dari Database
  let currentFulfillmentTab = 'proses';
  
  const token = typeof TOKEN !== 'undefined' ? TOKEN : "<?= token ?>";
  window.SUPABASE_URL = window.SUPABASE_URL || "https://vxongwtxmhjixhzeoidp.supabase.co";
  window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "sb_publishable_XFvjJipUzyi0EuM_tDTTsg_ll7TJ7rA";

  function initFulfillmentView() {
    if (!isFulfillmentInitialized) {
      isFulfillmentInitialized = true;
      muatDataFulfillment(false);
    }
  }

  // ============ TAB SWITCHER (ON PROSES vs SELESAI) ============
  function switchFulfillmentTab(tab) {
    currentFulfillmentTab = tab;
    const tabProses = document.getElementById('fulfillmentTabProses');
    const tabSelesai = document.getElementById('fulfillmentTabSelesai');
    const btnProses = document.getElementById('tabBtnFulfillmentProses');
    const btnSelesai = document.getElementById('tabBtnFulfillmentSelesai');

    if (tab === 'proses') {
      if (tabProses) tabProses.style.display = 'block';
      if (tabSelesai) tabSelesai.style.display = 'none';
      if (btnProses) btnProses.classList.add('active');
      if (btnSelesai) btnSelesai.classList.remove('active');
    } else {
      if (tabProses) tabProses.style.display = 'none';
      if (tabSelesai) tabSelesai.style.display = 'block';
      if (btnProses) btnProses.classList.remove('active');
      if (btnSelesai) btnSelesai.classList.add('active');
      renderFulfillmentCompletedBubbles();
    }
  }

  // ============ MUAT DATA PERMANEN DARI DATABASE ============
  async function muatDataFulfillment(force) {
    const containerProses = document.getElementById('fulfillmentOnProcessContainer');
    if (containerProses && force) {
      containerProses.innerHTML = '<div style="text-align: center; padding: 35px 20px; color: var(--text-muted); font-style: italic;">⏳ Memperbarui data Picking List dari server...</div>';
    }

    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/picking_list?order=created_at.desc&limit=10000`, {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
        });
        if (!res.ok) throw new Error("Gagal mengambil data picking list");
        const data = await res.json();
        
        let groupsMap = {};
        data.forEach(row => {
            const noSJ = row.no_sj;
            if (!groupsMap[noSJ]) {
                groupsMap[noSJ] = {
                    noSJ: noSJ,
                    tujuan: row.tujuan || "Marketplace",
                    date: row.tanggal,
                    items: [],
                    totalQtyReq: 0,
                    totalQtyPicked: 0,
                    isCompleted: true, // Will be false if any item is not done
                    isPrinted: false,
                    status: 'SIAP PICKING'
                };
            }
            
            const isRowDone = row.status === 'SELESAI';
            const isRowPrinted = row.status === 'TERCETAK' || isRowDone;
            
            if (!isRowDone) groupsMap[noSJ].isCompleted = false;
            if (isRowPrinted) groupsMap[noSJ].isPrinted = true;
            
            groupsMap[noSJ].items.push({
                id: row.id,
                sku: row.sku,
                nama: row.nama_produk,
                qtyReq: row.qty_req,
                qtyPicked: row.qty_picked,
                lokasi: row.lokasi || "-",
                isChecked: isRowDone || (row.qty_picked > 0)
            });
            
            groupsMap[noSJ].totalQtyReq += row.qty_req;
            groupsMap[noSJ].totalQtyPicked += row.qty_picked;
            groupsMap[noSJ].status = row.status;
        });

        FULFILLMENT_ON_PROCESS = [];
        FULFILLMENT_COMPLETED = [];
        
        for (let sj in groupsMap) {
            const g = groupsMap[sj];
            g.totalItems = g.items.length;
            if (g.isCompleted || g.status === 'SELESAI') {
                g.status = "SELESAI";
                FULFILLMENT_COMPLETED.push(g);
            } else {
                g.status = g.isPrinted ? "TERCETAK" : "SIAP PICKING";
                FULFILLMENT_ON_PROCESS.push(g);
            }
        }

        updateTabBadges();
        renderFulfillmentOnProcessBubbles();
        renderFulfillmentCompletedBubbles();
        
    } catch (err) {
        if (containerProses) {
            containerProses.innerHTML = '<div style="text-align: center; color: var(--danger); padding: 30px;">Error koneksi: ' + err.message + '</div>';
        }
    }
  }

  function updateTabBadges() {
    const badgeP = document.getElementById('badgeCountProses');
    const badgeS = document.getElementById('badgeCountSelesai');
    const btnCetakAll = document.getElementById('btnTopCetakSemua');

    if (badgeP) badgeP.textContent = FULFILLMENT_ON_PROCESS.length;
    if (badgeS) badgeS.textContent = FULFILLMENT_COMPLETED.length;

    if (btnCetakAll) {
      btnCetakAll.style.display = FULFILLMENT_ON_PROCESS.length > 0 ? "inline-flex" : "none";
    }
  }

  function handleCsvFileSelected(input) {
    const files = input.files;
    const btn = document.getElementById('btnProcessFulfillment');
    if (files && files.length > 0 && btn) {
      btn.classList.add('pulse-highlight');
    }
  }

  function resetFulfillmentUpload() {
    const fileInput = document.getElementById('csvFileInput');
    if (fileInput) fileInput.value = '';
    const btn = document.getElementById('btnProcessFulfillment');
    if (btn) btn.classList.remove('pulse-highlight');
  }

  function showFulfillmentToast(ok, msg) {
    const el = document.getElementById('fulfillmentToast');
    if (!el) return;
    el.style.display = 'block';
    el.style.background = ok ? 'var(--success-light)' : 'var(--danger-light)';
    el.style.border = '1px solid ' + (ok ? 'var(--success)' : 'var(--danger)');
    el.style.color = ok ? 'var(--success)' : 'var(--danger)';
    el.innerHTML = (ok ? '✓ ' : '⚠️ ') + msg;
    setTimeout(function () { el.style.display = 'none'; }, 6000);
  }

  async function fetchAllWarehouseStocksFromSupabase() {
    let allStocks = [];
    let offset = 0;
    const chunkSize = 1000;

    try {
      while (true) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/view_stok_realtime?select=sku,lokasi,sisa_stok&sisa_stok=gt.0&area=ilike.Warehouse&offset=${offset}&limit=${chunkSize}&order=sku.asc,lokasi.asc`, {
          headers: { 
            'apikey': SUPABASE_ANON_KEY, 
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY 
          }
        });
        if (!res.ok) break;
        const chunk = await res.json();
        if (!Array.isArray(chunk) || chunk.length === 0) break;
        allStocks.push(...chunk);
        if (chunk.length < chunkSize) break;
        offset += chunkSize;
      }
    } catch (e) {
      console.warn("fetchAllWarehouseStocksFromSupabase error:", e);
    }
    return allStocks;
  }

  // ============ PROSES BATCH CSV (FULFILLMENT UPLOAD) ============
  async function handleProcessFulfillment(force = false) {
    const fileInput = document.getElementById('csvFileInput');
    const files = fileInput ? fileInput.files : null;

    if (!files || files.length === 0) {
      showFulfillmentToast(false, "Silakan pilih minimal 1 file CSV Transfer Order terlebih dahulu.");
      return;
    }

    const chkDirectPrint = document.getElementById('chkDirectPrint');
    const isDirectPrint = chkDirectPrint ? chkDirectPrint.checked : false;

    const btn = document.getElementById('btnProcessFulfillment');
    const icon = document.getElementById('processIcon');
    const label = document.getElementById('processLabel');

    if (btn) btn.disabled = true;
    if (icon) icon.innerHTML = "⏳";
    if (label) label.textContent = "MEMPROSES CSV...";

    try {
        // Load Seluruh Realtime Stock Warehouse dari Supabase (dengan pagination)
        const stockData = await fetchAllWarehouseStocksFromSupabase();
        let stockMap = {};
        stockData.forEach(st => {
            const s = (st.sku || '').toUpperCase();
            if (!s || !st.lokasi) return;
            if(!stockMap[s]) stockMap[s] = [];
            stockMap[s].push({lokasi: st.lokasi, qty: Number(st.sisa_stok) || 0});
        });
        
        let allRowsToInsert = [];
        let duplicateSJList = [];
        
        // Fetch existing SJs to check for duplicates
        const existRes = await fetch(`${SUPABASE_URL}/rest/v1/picking_list?select=no_sj`, {
             headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
        });
        const existingSJSet = new Set();
        if (existRes.ok) {
            const ed = await existRes.json();
            ed.forEach(r => existingSJSet.add(r.no_sj));
        }

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const csvText = await file.text();
            
            const lines = csvText.split(/\r\n|\n/);
            if (lines.length < 2) continue;

            for (let j = 1; j < lines.length; j++) {
                const line = lines[j].trim();
                if (!line) continue;
                
                const row = parseRefillCsvLine(line);
                if (row.length < 10) continue;
                
                const dateVal = row[0] || "";
                const noSJ = String(row[1] || "").trim();
                const produk = String(row[3] || "").trim();
                const variant = String(row[4] || "").trim();
                const sku = String(row[5] || "").trim().toUpperCase();
                const qty = Number(row[7]) || 0;
                const tujuan = String(row[9] || "").trim();
                
                if (noSJ && qty > 0) {
                    if (existingSJSet.has(noSJ) && !force) {
                        if (!duplicateSJList.includes(noSJ)) duplicateSJList.push(noSJ);
                        continue;
                    }
                    
                    let namaFinal = produk;
                    if (variant && variant !== "-" && variant.toLowerCase() !== "default") {
                        const pLower = produk.toLowerCase();
                        const vLower = variant.toLowerCase();
                        if (vLower === pLower) {
                            namaFinal = produk;
                        } else if (vLower.includes(pLower)) {
                            namaFinal = variant;
                        } else {
                            namaFinal = produk + " (" + variant + ")";
                        }
                    }
                    
                    // Simple allocation
                    let lokasiList = [];
                    let sisaReq = qty;
                    if (stockMap[sku]) {
                        // sort desc by qty
                        stockMap[sku].sort((a,b) => b.qty - a.qty);
                        for (let st of stockMap[sku]) {
                            if (st.qty <= 0) continue;
                            const ambil = Math.min(st.qty, sisaReq);
                            lokasiList.push(st.lokasi);
                            st.qty -= ambil;
                            sisaReq -= ambil;
                            if (sisaReq <= 0) break;
                        }
                    }
                    const assignedLokasi = lokasiList.length > 0 ? lokasiList.join(" | ") : "-";
                    
                    allRowsToInsert.push({
                        no_sj: noSJ,
                        tanggal: dateVal,
                        tujuan: tujuan || "Marketplace",
                        sku: sku,
                        nama_produk: namaFinal,
                        qty_req: qty,
                        lokasi: assignedLokasi,
                        status: isDirectPrint ? 'TERCETAK' : 'PENDING'
                    });
                }
            }
        }
        
        if (duplicateSJList.length > 0 && !force) {
            if (btn) btn.disabled = false;
            if (icon) icon.innerHTML = "⚡";
            if (label) label.textContent = "PROSES CSV";
            if (confirm("Nomor Surat Jalan berikut sudah pernah diinput ke database:\\n• " + duplicateSJList.join("\\n• ") + "\\n\\nApakah Anda ingin tetap memprosesnya ulang?")) {
                handleProcessFulfillment(true);
            }
            return;
        }
        
        if (allRowsToInsert.length === 0) {
            showFulfillmentToast(false, "Format CSV tidak valid atau tidak ada baris barang dengan Qty > 0.");
            if (btn) btn.disabled = false;
            if (icon) icon.innerHTML = "⚡";
            if (label) label.textContent = "PROSES CSV";
            return;
        }
        
        // Ambil ID tertinggi saat ini agar tidak terjadi tabrakan sequence primary key
        let currentMaxId = 0;
        try {
            const maxRes = await fetch(`${SUPABASE_URL}/rest/v1/picking_list?select=id&order=id.desc&limit=1`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            if (maxRes.ok) {
                const maxData = await maxRes.json();
                if (maxData && maxData.length > 0 && maxData[0].id) {
                    currentMaxId = Number(maxData[0].id) || 0;
                }
            }
        } catch (eMax) {
            console.warn("Gagal cek max id picking_list:", eMax);
        }

        // Berikan ID eksplisit untuk setiap baris agar aman 100% dari conflict sequence PostgreSQL
        let nextId = currentMaxId + 1;
        for (let row of allRowsToInsert) {
            row.id = nextId++;
        }

        // POST to supabase
        const insRes = await fetch(`${SUPABASE_URL}/rest/v1/picking_list`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify(allRowsToInsert)
        });
        
        if (!insRes.ok) {
            let detailErr = "";
            try {
                const errJson = await insRes.json();
                detailErr = errJson.message || errJson.error || JSON.stringify(errJson);
            } catch (eParse) {
                detailErr = await insRes.text();
            }
            throw new Error("Gagal menyimpan ke Supabase: " + detailErr);
        }
        
        showFulfillmentToast(true, "Transfer Order berhasil disimpan ke database! 📦");
        resetFulfillmentUpload();
        await muatDataFulfillment(true);
        
        if (isDirectPrint) {
            // Group and generate PDF...
            google.script.run
            .withSuccessHandler(res => {
                if(res.success) openPdfPopup(res.pdfData, "Surat_Jalan_Gabungan");
            })
            .cetakMultipleSuratJalanRefill(FULFILLMENT_ON_PROCESS.filter(x => allRowsToInsert.some(ins => ins.no_sj === x.noSJ)));
        }
        
    } catch (err) {
        showFulfillmentToast(false, "Terjadi kesalahan: " + err.message);
    }
    
    if (btn) btn.disabled = false;
    if (icon) icon.innerHTML = "⚡";
    if (label) label.textContent = "PROSES CSV";
  }
  
  function parseRefillCsvLine(text) {
    let result = [];
    let current = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (char === '"') {
            inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = "";
        } else {
            current += char;
        }
    }
    result.push(current.trim());
    return result;
  }

  // ============ INTERAKSI CEKLIS & EDIT PICKED QTY ============
  function toggleCheckItem(bIdx, itemIdx) {
    const bubble = FULFILLMENT_ON_PROCESS[bIdx];
    if (!bubble || !bubble.items || !bubble.items[itemIdx]) return;

    const item = bubble.items[itemIdx];
    item.isChecked = !item.isChecked;

    if (item.isChecked && (item.qtyPicked === undefined || item.qtyPicked === 0)) {
      item.qtyPicked = item.qtyReq || 1;
    }

    // Update row DOM
    const rowEl = document.getElementById(`pickRow_${bIdx}_${itemIdx}`);
    if (rowEl) {
      const btnCheck = rowEl.querySelector('.btn-check-pick');
      const inputQty = rowEl.querySelector('.input-qty-pick');

      if (item.isChecked) {
        rowEl.classList.add('row-picked-active');
        if (btnCheck) {
          btnCheck.classList.add('checked');
          btnCheck.textContent = '✓';
        }
        if (inputQty) inputQty.value = item.qtyPicked;
      } else {
        rowEl.classList.remove('row-picked-active');
        if (btnCheck) {
          btnCheck.classList.remove('checked');
          btnCheck.textContent = '';
        }
      }
    }

    updateBubbleProgress(bIdx);
  }

  function updateItemPickedQty(bIdx, itemIdx, val) {
    const bubble = FULFILLMENT_ON_PROCESS[bIdx];
    if (!bubble || !bubble.items || !bubble.items[itemIdx]) return;

    const item = bubble.items[itemIdx];
    const parsed = parseInt(val, 10);
    item.qtyPicked = isNaN(parsed) ? 0 : Math.max(0, parsed);

    if (item.qtyPicked > 0 && !item.isChecked) {
      toggleCheckItem(bIdx, itemIdx);
    } else {
      updateBubbleProgress(bIdx);
    }
  }

  function updateBubbleProgress(bIdx) {
    const bubble = FULFILLMENT_ON_PROCESS[bIdx];
    if (!bubble || !bubble.items) return;

    let checkedCount = 0;
    let totalPcsPicked = 0;
    const totalItems = bubble.items.length;

    bubble.items.forEach(it => {
      if (it.isChecked) {
        checkedCount++;
        totalPcsPicked += (Number(it.qtyPicked) || 0);
      }
    });

    const pct = totalItems > 0 ? Math.round((checkedCount / totalItems) * 100) : 0;
    const fillEl = document.getElementById(`progFill_${bIdx}`);
    const textEl = document.getElementById(`progText_${bIdx}`);
    const pickedTotalEl = document.getElementById(`pickedTotal_${bIdx}`);

    if (fillEl) fillEl.style.width = `${pct}%`;
    if (textEl) textEl.textContent = `${checkedCount}/${totalItems}`;
    if (pickedTotalEl) pickedTotalEl.textContent = `${totalPcsPicked} Pcs`;
  }

  async function konfirmasiSelesaiPicking(bIdx, btn) {
    const bubble = FULFILLMENT_ON_PROCESS[bIdx];
    if (!bubble) return;

    const items = bubble.items || [];
    let checkedCount = 0;
    let totalPicked = 0;
    items.forEach(it => {
      if (it.isChecked) {
        checkedCount++;
        totalPicked += (Number(it.qtyPicked) || 0);
      }
    });

    let confirmMsg = `Konfirmasi selesai picking untuk Surat Jalan ${bubble.noSJ} (${bubble.tujuan})?\\n\\n` +
      `• Total SKU: ${items.length}\\n` +
      `• SKU Diceklis: ${checkedCount} dari ${items.length}\\n` +
      `• Total Fisik Diambil: ${totalPicked} dari ${bubble.totalQtyReq} pcs\\n\\n` +
      `Picking list ini akan otomatis dipindahkan ke tab SELESAI PICKING. Lanjutkan?`;

    if (!confirm(confirmMsg)) return;

    if (btn) btn.innerHTML = 'MENYIMPAN...';

    try {
        const pickerName = (typeof CURRENT_USER !== 'undefined' && CURRENT_USER) ? CURRENT_USER : 'Picker';
        
        // Update all items in Supabase
        const promises = items.map(it => {
            const finalQty = it.isChecked ? (it.qtyPicked !== undefined ? it.qtyPicked : it.qtyReq) : 0;
            return fetch(`${SUPABASE_URL}/rest/v1/picking_list?id=eq.${it.id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    qty_picked: finalQty,
                    status: 'SELESAI',
                    picker_name: pickerName
                })
            });
        });
        
        await Promise.all(promises);
        
        if (window.showToast) window.showToast("Picking selesai! Dipindahkan ke tab Selesai.", "success");
        await muatDataFulfillment(true);
        
    } catch(err) {
        alert("Error: " + err.message);
    }
    if (btn) btn.innerHTML = '✓ DONE';
  }

          return fetch(`${SUPABASE_URL}/rest/v1/picking_list?no_sj=eq.${encodeURIComponent(sj)}&status=eq.PENDING`, {

    const bubble = FULFILLMENT_ON_PROCESS[bIdx];

    if (btn && window.setButtonLoading) window.setButtonLoading(btn, true, 'MEMBUAT PDF...');

    updateStatusCetak([bubble.noSJ]).then(() => {
        google.script.run

              bubble.isPrinted = true;
              bubble.status = "TERCETAK";

              openPdfPopup(res.pdfData, `Surat_Jalan_${bubble.noSJ}`);
            } else {
              alert("Gagal membuat PDF: " + (res ? res.message : "Error tidak diketahui"));
            }
          })
          .withFailureHandler(err => {
            if (btn && window.setButtonLoading) window.setButtonLoading(btn, false);
            alert("Error server: " + err.message);
          })
          .cetakSingleSuratJalanRefill(bubble);
    });
  }

  function cetakSingleSuratJalanCompleted(noSJ, btn) {
    const bubble = FULFILLMENT_COMPLETED.find(b => b.noSJ === noSJ);
    if (!bubble) return;

    if (btn && window.setButtonLoading) window.setButtonLoading(btn, true, 'MEMBUAT PDF...');

    google.script.run
      .withSuccessHandler(res => {
        if (btn && window.setButtonLoading) window.setButtonLoading(btn, false);
        if (res && res.success && res.pdfData) {
          openPdfPopup(res.pdfData, `Surat_Jalan_${bubble.noSJ}`);
        } else {
          alert("Gagal membuat PDF: " + (res ? res.message : "Error"));
        }
      })
      .withFailureHandler(err => {
        if (btn && window.setButtonLoading) window.setButtonLoading(btn, false);
        alert("Error server: " + err.message);
      })
      .cetakSingleSuratJalanRefill(bubble);
  }

  function cetakSemuaSuratJalanAktif() {
    if (FULFILLMENT_ON_PROCESS.length === 0) {
      alert("Tidak ada Surat Jalan aktif untuk dicetak.");
      return;
    }

    const btn = document.getElementById('btnTopCetakSemua');
    if (btn && window.setButtonLoading) window.setButtonLoading(btn, true, 'MEMBUAT PDF...');

    const sjList = FULFILLMENT_ON_PROCESS.map(b => b.noSJ);
    updateStatusCetak(sjList).then(() => {
        google.script.run
          .withSuccessHandler(res => {
            if (btn && window.setButtonLoading) window.setButtonLoading(btn, false);
            if (res && res.success && res.pdfData) {
              FULFILLMENT_ON_PROCESS.forEach(b => {
                b.isPrinted = true;
                b.status = "TERCETAK";
              });
              renderFulfillmentOnProcessBubbles();
              openPdfPopup(res.pdfData, "Semua_Surat_Jalan_Aktif");
            } else {
              alert("Gagal membuat PDF: " + (res ? res.message : "Error"));
            }
          })
          .withFailureHandler(err => {
            if (btn && window.setButtonLoading) window.setButtonLoading(btn, false);
            alert("Error: " + err.message);
          })
          .cetakMultipleSuratJalanRefill(FULFILLMENT_ON_PROCESS);
    });
  }

  // ============ POPUP PDF & PRINT ============
  function openPdfPopup(base64PdfData, docTitle = "Surat_Jalan_Refill") {
    var win = window.open();
    if (!win) {
      alert("Pop-up diblokir oleh browser! Izinkan pop-up untuk situs ini agar PDF Surat Jalan dapat ditampilkan.");
      return;
    }
    win.document.write(
      `<html><head><title>${escapeHtml(docTitle)}</title></head>` +
      `<body style="margin:0; background:#333;">` +
      `<iframe src="${base64PdfData}" style="width:100%; height:100%; border:none;"></iframe>` +
      `</body></html>`
    );
    setTimeout(() => { 
      try { win.print(); } catch(e) {}
    }, 1200);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // Expose function global ke window
  window.initFulfillmentView = initFulfillmentView;
  window.switchFulfillmentTab = switchFulfillmentTab;
  window.muatDataFulfillment = muatDataFulfillment;
  window.handleProcessFulfillment = handleProcessFulfillment;
  window.handleCsvFileSelected = handleCsvFileSelected;
  window.resetFulfillmentUpload = resetFulfillmentUpload;
  window.toggleCheckItem = toggleCheckItem;
  window.updateItemPickedQty = updateItemPickedQty;
  window.toggleBubbleDetail = toggleBubbleDetail;
  window.konfirmasiSelesaiPicking = konfirmasiSelesaiPicking;
  window.toggleCompletedDetail = toggleCompletedDetail;
  window.kembalikanKeProses = kembalikanKeProses;
  window.cetakSingleSuratJalan = cetakSingleSuratJalan;
  window.cetakSingleSuratJalanCompleted = cetakSingleSuratJalanCompleted;
  window.cetakSemuaSuratJalanAktif = cetakSemuaSuratJalanAktif;

</script>
